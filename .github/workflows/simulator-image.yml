name: Simulator Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to publish
        required: false
        default: simulator-bridge-admin
  push:
    branches:
      - main
      - codex/admin-bridge-token-endpoints
    paths:
      - Dockerfile
      - backend/**
      - deploy/docker-entrypoint.sh
      - docs/legal/**
      - frontend/**
      - .github/workflows/simulator-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="${{ github.event.inputs.image_tag || 'simulator-bridge-admin' }}"
          echo "name=ghcr.io/${owner}/sub2api" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            VERSION=0.1.141-simulator.${{ github.run_number }}
            COMMIT=${{ github.sha }}
            GOPROXY=https://goproxy.cn,direct
            GOSUMDB=sum.golang.google.cn
